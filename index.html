<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>senin icin hazirladim</title>
    <style>
        *,
        *::after,
        *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-color: #030105;
            --lila-light: #e0b1ff;
            --lila-medium: #b06ab3;
            --neon-purple: #bc13fe;
        }

        body {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--dark-color);
            overflow: hidden;
            perspective: 1000px;
        }

        .night {
            position: fixed;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: radial-gradient(ellipse at top, transparent 0%, var(--dark-color)),
                radial-gradient(ellipse at bottom, #1a0a2e, var(--dark-color));
        }

        .flowers {
            position: relative;
            transform: scale(0.9);
        }

        /* ÇİÇEK MODELİ */
        .flower {
            position: absolute;
            bottom: 10vmin;
            transform-origin: bottom center;
            z-index: 10;
        }

        .flower--1 {
            animation: moving-flower-1 4s linear infinite;
        }

        .flower--1 .flower__line {
            height: 70vmin;
            animation-delay: 0.3s;
        }

        .flower--2 {
            left: 50%;
            transform: rotate(20deg);
            animation: moving-flower-2 4s linear infinite;
        }

        .flower--2 .flower__line {
            height: 60vmin;
            animation-delay: 0.6s;
        }

        .flower--3 {
            left: 50%;
            transform: rotate(-15deg);
            animation: moving-flower-3 4s linear infinite;
        }

        .flower--3 .flower__line {
            height: 55vmin;
            animation-delay: 0.9s;
        }

        .flower__leafs {
            position: relative;
            animation: blooming-flower 2s backwards;
        }

        .flower__leafs::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -100%);
            width: 8vmin;
            height: 8vmin;
            background-color: var(--lila-light);
            filter: blur(10vmin);
        }

        .flower__leaf {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 8vmin;
            height: 11vmin;
            border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;
            background-image: linear-gradient(to top, var(--lila-medium), var(--lila-light));
            transform-origin: bottom center;
            opacity: 0.9;
            box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.5);
        }

        .flower__leaf--1 {
            transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
        }

        .flower__leaf--2 {
            transform: translate(-50%, -4%) rotateX(40deg);
        }

        .flower__leaf--3 {
            transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg);
        }

        .flower__white-circle {
            position: absolute;
            left: -3.5vmin;
            top: -3.5vmin;
            width: 9vmin;
            height: 4vmin;
            border-radius: 50%;
            background-color: #fff;
            opacity: 0.4;
        }

        .flower__line {
            width: 1.5vmin;
            background-image: linear-gradient(to top, rgba(0, 0, 0, 0.2), transparent), linear-gradient(to top, #0a3d3d, #14757a);
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
            animation: grow-flower-tree 3s backwards;
        }

        .flower__line__leaf {
            position: absolute;
            width: 7vmin;
            height: 9vmin;
            background-image: linear-gradient(to top, rgba(20, 117, 122, 0.4), #14757a);
        }

        .leaf--left {
            border-top-right-radius: 9vmin;
            border-bottom-left-radius: 9vmin;
            left: -6.5vmin;
            transform: rotate(-70deg) rotateY(30deg);
        }

        .leaf--right {
            border-top-left-radius: 9vmin;
            border-bottom-right-radius: 9vmin;
            right: -6.5vmin;
            transform: rotate(70deg) rotateY(30deg);
        }

        /* BELİRGİN RETRO NOKTA EFEKTİ */
        .pixel-dot {
            position: absolute;
            background-color: var(--lila-light);
            pointer-events: none;
            z-index: 100;
            animation: retroGlitchFloat 2.5s ease-out forwards;
        }

        @keyframes retroGlitchFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }

            10% {
                opacity: 1;
                transform: translate(2px, -10px);
            }

            30% {
                transform: translate(-3px, -30px);
            }

            50% {
                transform: translate(4px, -50px);
                filter: brightness(1.5);
            }

            100% {
                transform: translate(-2px, -120px) scale(0);
                opacity: 0;
            }
        }

        /* TIKLAMA KALP EFEKTİ */
        .heart {
            position: fixed;
            pointer-events: none;
            color: var(--lila-light);
            animation: heartFall 1.5s ease-out forwards;
            z-index: 100;
        }

        @keyframes heartFall {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(100px) scale(0);
                opacity: 0;
            }
        }

        /* ANİMASYONLAR */
        @keyframes grow-flower-tree {
            0% {
                height: 0;
            }
        }

        @keyframes blooming-flower {
            0% {
                transform: scale(0);
            }
        }

        @keyframes moving-flower-1 {

            0%,
            100% {
                transform: rotate(2deg);
            }

            50% {
                transform: rotate(-2deg);
            }
        }

        @keyframes moving-flower-2 {

            0%,
            100% {
                transform: rotate(18deg);
            }

            50% {
                transform: rotate(14deg);
            }
        }

        @keyframes moving-flower-3 {

            0%,
            100% {
                transform: rotate(-18deg);
            }

            50% {
                transform: rotate(-22deg);
            }
        }
    </style>
</head>

<body onclick="spawnHearts(event)">

    <div class="night"></div>
    <div class="flowers">
        <div class="flower flower--1" id="fl1">
            <div class="flower__leafs">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf leaf--left" style="top:25%"></div>
                <div class="flower__line__leaf leaf--right" style="top:50%"></div>
            </div>
        </div>
        <div class="flower flower--2" id="fl2">
            <div class="flower__leafs">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf leaf--left" style="top:30%"></div>
            </div>
        </div>
        <div class="flower flower--3" id="fl3">
            <div class="flower__leafs">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf leaf--right" style="top:25%"></div>
            </div>
        </div>
    </div>

    <script>
        const colors = ['#e0b1ff', '#ffffff', '#bc13fe', '#ff00ff'];

        function createPixel(targetId) {
            const flower = document.getElementById(targetId);
            const dot = document.createElement('div');
            dot.className = 'pixel-dot';

            const size = Math.random() * 4 + 2;
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';

            dot.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            dot.style.boxShadow = `0 0 ${size * 2}px ${dot.style.backgroundColor}`;

            const randomX = (Math.random() - 0.5) * 80;
            dot.style.left = randomX + "px";
            dot.style.top = "-10px";

            flower.querySelector('.flower__leafs').appendChild(dot);

            setTimeout(() => { dot.remove(); }, 2500);
        }

        setInterval(() => createPixel('fl1'), 150);
        setInterval(() => createPixel('fl2'), 250);
        setInterval(() => createPixel('fl3'), 200);

        function spawnHearts(e) {
            for (let i = 0; i < 6; i++) {
                const h = document.createElement('div');
                h.className = 'heart'; h.innerHTML = '💜';
                h.style.left = `${e.clientX + (Math.random() - 0.5) * 40}px`;
                h.style.top = `${e.clientY + (Math.random() - 0.5) * 40}px`;
                h.style.fontSize = `${15 + Math.random() * 15}px`;
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 1500);
