<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>senin icin hazirladim</title>
    <style>
        *,
        *::after,
        *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-color: #02040a;
            --navy-deep: #060b1f;
            --navy-mid: #0b1637;
            --indigo: #16215a;
            --ice-blue: #a5f3fc;
            --ice-white: #f0f9ff;
            --sky-cyan: #38bdf8;
            --sapphire: #1e40af;
            --sapphire-deep: #14235c;
            --night-lilac: #c084fc;
            --night-lilac-deep: #6b21a8;
            --stem-teal: #0a2f3a;
            --stem-emerald: #0e5b6b;
        }

        html, body {
            height: 100%;
        }

        body {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--dark-color);
            overflow: hidden;
            perspective: 1000px;
        }

        .night {
            position: fixed;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            z-index: -3;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(30, 64, 175, 0.35), transparent 55%),
                radial-gradient(ellipse at top, transparent 0%, var(--navy-deep) 60%),
                radial-gradient(ellipse at bottom, var(--indigo) 0%, var(--dark-color) 75%);
        }

        /* YILDIZ KATMANLARI */
        .stars {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
        }

        .stars__layer {
            position: absolute;
            inset: 0;
            background-repeat: repeat;
            opacity: 0.8;
        }

        .stars__layer--1 {
            background-image: radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, transparent),
                radial-gradient(1px 1px at 90px 120px, var(--ice-blue), transparent),
                radial-gradient(1.5px 1.5px at 150px 60px, #ffffff, transparent),
                radial-gradient(1px 1px at 210px 160px, var(--sky-cyan), transparent),
                radial-gradient(1.5px 1.5px at 260px 20px, #ffffff, transparent);
            background-size: 280px 200px;
            animation: twinkle 4s ease-in-out infinite alternate, drift-slow 90s linear infinite;
        }

        .stars__layer--2 {
            background-image: radial-gradient(1px 1px at 40px 80px, var(--ice-blue), transparent),
                radial-gradient(2px 2px at 130px 40px, #ffffff, transparent),
                radial-gradient(1px 1px at 190px 140px, var(--night-lilac), transparent),
                radial-gradient(1.5px 1.5px at 240px 100px, #ffffff, transparent);
            background-size: 320px 260px;
            opacity: 0.55;
            animation: twinkle 6s ease-in-out infinite alternate-reverse, drift-slow 140s linear infinite reverse;
        }

        @keyframes twinkle {
            0% { opacity: 0.35; }
            100% { opacity: 0.95; }
        }

        @keyframes drift-slow {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        .flowers {
            position: relative;
            transform: scale(1.05);
            transform-style: preserve-3d;
        }

        /* ÇİÇEK GÖVDESİ */
        .flower {
            position: absolute;
            bottom: 10vmin;
            transform-origin: bottom center;
            z-index: 10;
        }

        /* Rüzgarda organik, senkron olmayan salınım */
        .flower--1 {
            animation: sway-1 6.4s ease-in-out infinite;
        }

        .flower--1 .flower__line {
            height: 70vmin;
            animation-delay: 0.3s;
        }

        .flower--2 {
            left: 50%;
            transform: rotate(20deg);
            animation: sway-2 7.8s ease-in-out infinite;
            animation-delay: 0.9s;
        }

        .flower--2 .flower__line {
            height: 60vmin;
            animation-delay: 0.6s;
        }

        .flower--3 {
            left: 50%;
            transform: rotate(-15deg);
            animation: sway-3 5.6s ease-in-out infinite;
            animation-delay: 1.6s;
        }

        .flower--3 .flower__line {
            height: 55vmin;
            animation-delay: 0.9s;
        }

        .flower__leafs {
            position: relative;
            animation: blooming-flower 2.2s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
            transform-style: preserve-3d;
        }

        .flower__leafs::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -95%);
            width: 13vmin;
            height: 13vmin;
            background-color: var(--ice-blue);
            filter: blur(10vmin);
            opacity: 0.6;
        }

        /* ÖN KATMAN — ana 3 yaprak, aydınlık ve büyük */
        .flower__leaf {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 9vmin;
            height: 13vmin;
            border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;
            background-image: linear-gradient(to top, var(--sapphire), var(--ice-blue));
            transform-origin: bottom center;
            opacity: 0.95;
            z-index: 3;
            filter: drop-shadow(0 -0.6vmin 1.2vmin rgba(165, 243, 252, 0.4)) drop-shadow(0 1.5vmin 1.5vmin rgba(2, 4, 10, 0.55));
            box-shadow: inset 0 0 2.2vmin rgba(255, 255, 255, 0.5), inset 0 -1vmin 1.5vmin rgba(20, 35, 92, 0.5);
        }

        .flower__leaf--1 {
            transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
        }

        .flower__leaf--2 {
            transform: translate(-50%, -4%) rotateX(40deg);
        }

        .flower__leaf--3 {
            transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg);
        }

        /* ARKA KATMAN — 5 küçük, sivri, derin safir/gece leylağı yaprak: dolgunluk verir */
        .flower__leaf--back {
            width: 6vmin;
            height: 9.5vmin;
            border-radius: 60% 40% 55% 45% / 70% 65% 35% 30%;
            background-image: linear-gradient(to top, var(--night-lilac-deep), var(--sapphire-deep) 55%, var(--night-lilac));
            opacity: 0.85;
            z-index: 1;
            filter: drop-shadow(0 1vmin 1vmin rgba(2, 4, 10, 0.6));
            box-shadow: inset 0 0 1.6vmin rgba(192, 132, 252, 0.35);
        }

        .flower__leaf--back-1 {
            transform: translate(-4%, 3%) rotateY(60deg) rotateX(-30deg) scale(0.85);
        }

        .flower__leaf--back-2 {
            transform: translate(-96%, 3%) rotateY(-60deg) rotateX(30deg) scale(0.85);
        }

        .flower__leaf--back-3 {
            transform: translate(-30%, -2%) rotateY(75deg) rotateX(-65deg) scale(0.75);
        }

        .flower__leaf--back-4 {
            transform: translate(-70%, -2%) rotateY(-75deg) rotateX(65deg) scale(0.75);
        }

        .flower__leaf--back-5 {
            transform: translate(-50%, -10%) rotateX(70deg) scale(0.9);
        }

        /* IŞILTILI MERKEZ (CORE) — iç içe geçmiş küçük taç yaprakları ve parıltı */
        .flower__core {
            position: absolute;
            left: -50%;
            top: -8.5vmin;
            width: 5vmin;
            height: 5vmin;
            z-index: 4;
            transform-style: preserve-3d;
        }

        .flower__core-glow {
            position: absolute;
            inset: -3vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(240, 249, 255, 0.9), rgba(56, 189, 248, 0.45) 45%, transparent 75%);
            filter: blur(1.6vmin);
            animation: pulse-core 2.6s ease-in-out infinite;
        }

        .flower__core-petal {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 3.4vmin;
            height: 4.6vmin;
            margin-left: -1.7vmin;
            border-radius: 55% 45% 50% 50% / 60% 60% 40% 40%;
            background-image: linear-gradient(to top, var(--sky-cyan), var(--ice-white));
            transform-origin: bottom center;
            box-shadow: 0 0 1.4vmin rgba(165, 243, 252, 0.9), inset 0 0 1vmin rgba(255, 255, 255, 0.7);
            opacity: 0.98;
        }

        .flower__core-petal--1 { transform: rotate(0deg) scale(0.95); }
        .flower__core-petal--2 { transform: rotate(72deg) scale(0.85); }
        .flower__core-petal--3 { transform: rotate(144deg) scale(0.9); }
        .flower__core-petal--4 { transform: rotate(216deg) scale(0.85); }
        .flower__core-petal--5 { transform: rotate(288deg) scale(0.9); }

        .flower__core-heart {
            position: absolute;
            left: 50%;
            top: 45%;
            width: 1.6vmin;
            height: 1.6vmin;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: var(--ice-white);
            box-shadow: 0 0 2vmin var(--ice-blue), 0 0 3.5vmin var(--sky-cyan);
        }

        @keyframes pulse-core {
            0%, 100% { opacity: 0.75; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        /* SAP VE YAN YAPRAKLAR */
        .flower__line {
            width: 1.5vmin;
            background-image: linear-gradient(to top, rgba(0, 0, 0, 0.3), transparent), linear-gradient(to top, var(--stem-teal), var(--stem-emerald));
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5), 0 0 1.5vmin rgba(14, 91, 107, 0.35);
            animation: grow-flower-tree 3s ease-out backwards;
        }

        .flower__line__leaf {
            position: absolute;
            width: 7vmin;
            height: 9vmin;
            background-image: linear-gradient(to top, rgba(14, 91, 107, 0.4), var(--stem-emerald));
        }

        .leaf--left {
            border-top-right-radius: 9vmin;
            border-bottom-left-radius: 9vmin;
            left: -6.5vmin;
            transform: rotate(-70deg) rotateY(30deg);
        }

        .leaf--right {
            border-top-left-radius: 9vmin;
            border-bottom-right-radius: 9vmin;
            right: -6.5vmin;
            transform: rotate(70deg) rotateY(30deg);
        }

        /* RETRO PARILTI NOKTA EFEKTİ — merkezden yükselir */
        .pixel-dot {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            animation: retroGlitchFloat 2.6s ease-out forwards;
        }

        @keyframes retroGlitchFloat {
            0% {
                transform: translate(0, 0) scale(0.6);
                opacity: 0;
            }

            10% {
                opacity: 1;
                transform: translate(2px, -10px) scale(1);
            }

            30% {
                transform: translate(-3px, -30px) scale(1);
            }

            50% {
                transform: translate(4px, -55px) scale(1.1);
                filter: brightness(1.6);
            }

            100% {
                transform: translate(-2px, -125px) scale(0);
                opacity: 0;
            }
        }

        /* TIKLAMA PARILTI EFEKTİ */
        .heart {
            position: fixed;
            pointer-events: none;
            color: var(--ice-blue);
            text-shadow: 0 0 8px var(--sky-cyan), 0 0 16px var(--night-lilac);
            animation: heartFall 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            z-index: 100;
        }

        @keyframes heartFall {
            0% {
                transform: translateY(0) scale(0.4) rotate(0deg);
                opacity: 1;
            }

            60% {
                opacity: 1;
            }

            100% {
                transform: translateY(110px) scale(0) rotate(15deg);
                opacity: 0;
            }
        }

        /* GİRİŞ VE BÜYÜME ANİMASYONLARI */
        @keyframes grow-flower-tree {
            0% {
                height: 0;
            }
        }

        @keyframes blooming-flower {
            0% {
                transform: scale(0);
            }
        }

        /* ORGANİK RÜZGAR SALINIMI — her çiçek için farklı genlik ve ritim */
        @keyframes sway-1 {
            0%   { transform: rotate(1.5deg) skewX(0.5deg) translateX(0); }
            28%  { transform: rotate(-2.2deg) skewX(-1.2deg) translateX(-0.4vmin); }
            55%  { transform: rotate(2.6deg) skewX(1.4deg) translateX(0.5vmin); }
            80%  { transform: rotate(-1deg) skewX(-0.6deg) translateX(-0.2vmin); }
            100% { transform: rotate(1.5deg) skewX(0.5deg) translateX(0); }
        }

        @keyframes sway-2 {
            0%   { transform: rotate(20deg) skewX(-1deg) translateX(0); }
            32%  { transform: rotate(15.5deg) skewX(1.6deg) translateX(0.6vmin); }
            60%  { transform: rotate(23deg) skewX(-1.8deg) translateX(-0.5vmin); }
            85%  { transform: rotate(18deg) skewX(0.8deg) translateX(0.3vmin); }
            100% { transform: rotate(20deg) skewX(-1deg) translateX(0); }
        }

        @keyframes sway-3 {
            0%   { transform: rotate(-15deg) skewX(0.8deg) translateX(0); }
            25%  { transform: rotate(-19.5deg) skewX(-1.3deg) translateX(-0.5vmin); }
            58%  { transform: rotate(-11deg) skewX(1.6deg) translateX(0.6vmin); }
            82%  { transform: rotate(-17deg) skewX(-0.6deg) translateX(-0.3vmin); }
            100% { transform: rotate(-15deg) skewX(0.8deg) translateX(0); }
        }

        @media (max-width: 600px) {
            .flowers {
                transform: scale(0.8);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>

                    <div class="flower__core-petal flower__core-petal--1"></div>
                    <div class="flower__core-petal flower__core-petal--2"></div>
                    <div class="flower__core-petal flower__core-petal--3"></div>
                    <div class="flower__core-petal flower__core-petal--4"></div>
                    <div class="flower__core-petal flower__core-petal--5"></div>
                    <div class="flower__core-heart"></div>
                </div>
            </div>
            <div class="flower__line">
                <div class="flower__line__leaf leaf--right" style="top:25%"></div>
            </div>
        </div>
    </div>

    <script>
        const colors = ['#a5f3fc', '#38bdf8', '#c084fc', '#f0f9ff', '#1e40af'];

        function createPixel(targetId) {
            const flower = document.getElementById(targetId);
            const dot = document.createElement('div');
            dot.className = 'pixel-dot';

            const size = Math.random() * 4 + 2;
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';

            const color = colors[Math.floor(Math.random() * colors.length)];
            dot.style.backgroundColor = color;
            dot.style.boxShadow = `0 0 ${size * 2.5}px ${color}`;

            const randomX = (Math.random() - 0.5) * 50;
            dot.style.left = randomX + "px";
            dot.style.top = "0px";

            flower.querySelector('.flower__core').appendChild(dot);

            setTimeout(() => { dot.remove(); }, 2600);
        }

        setInterval(() => createPixel('fl1'), 150);
        setInterval(() => createPixel('fl2'), 250);
        setInterval(() => createPixel('fl3'), 200);

        const heartSymbols = ['💙', '❄️', '✨'];

        function spawnHearts(e) {
            for (let i = 0; i < 6; i++) {
                const h = document.createElement('div');
                h.className = 'heart';
                h.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                h.style.left = `${e.clientX + (Math.random() - 0.5) * 40}px`;
                h.style.top = `${e.clientY + (Math.random() - 0.5) * 40}px`;
                h.style.fontSize = `${15 + Math.random() * 15}px`;
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 1600);
            }
        }
    </script>
